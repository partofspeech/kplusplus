name: Tests without source credentials

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Scraper and GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and Chromium using the installer
        run: python install.py --dev
      - name: Use installed virtual environment
        shell: python
        run: |
          import os
          from pathlib import Path
          scripts = Path.cwd() / '.venv' / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
      - name: Unit tests and recorded decision tests
        run: python -m pytest tests --ignore=tests/offline --ignore=tests/gui -p no:cacheprovider -q --junitxml=artifacts/unit-tests.xml
      - name: Replay saved content in Chromium without website access
        env:
          SCRAPER_OFFLINE_BROWSER_TESTS: '1'
        run: python -m pytest tests/offline -p no:cacheprovider -q --junitxml=artifacts/offline-browser-tests.xml
      - name: Test local GUI without a source account
        env:
          SCRAPER_GUI_TESTS: '1'
        run: python -m pytest tests/gui -p no:cacheprovider -q --junitxml=artifacts/gui-tests.xml
      - name: Save reports and GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: artifacts/
