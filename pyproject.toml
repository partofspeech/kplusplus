[project]
name = "court-scraper"
version = "0.1.0"
description = "Collect court decisions from supported legal sources"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
court-scraper = "interfaces.cli:main"
kplusplus-app = "interfaces.web.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper*", "interfaces*", "ner*"]

[tool.setuptools.package-data]
"interfaces.web" = ["static/*.html", "static/*.css", "static/*.js"]
